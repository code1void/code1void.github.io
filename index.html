<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <!-- Animated Background -->
        <div class="background" id="background"></div>
        
        <!-- Background Selector -->
        <div class="bg-selector">
            <button class="bg-btn" data-bg="spring" title="Spring">🌸</button>
            <button class="bg-btn" data-bg="summer" title="Summer">☀️</button>
            <button class="bg-btn" data-bg="fall" title="Fall">🍂</button>
            <button class="bg-btn" data-bg="winter" title="Winter">❄️</button>
            <button class="bg-btn" data-bg="hacker-green" title="Hacker Green">💻</button>
            <button class="bg-btn" data-bg="hacker-purple" title="Hacker Purple">🌌</button>
        </div>

        <!-- Main Content -->
        <div class="main-container">
            <!-- Left: Time Display -->
            <div class="time-section">
                <div class="time-display" id="timeDisplay">00:00</div>
                <div class="date-display" id="dateDisplay">Monday, January 1</div>
            </div>

            <!-- Right: Side Calendar -->
            <div class="side-calendar">
                <div class="calendar-widget">
                    <div class="calendar-header">
                        <button id="prevMonth" class="month-btn">‹</button>
                        <h3 id="monthYear"></h3>
                        <button id="nextMonth" class="month-btn">›</button>
                    </div>
                    <div class="calendar-weekdays">
                        <div>S</div>
                        <div>M</div>
                        <div>T</div>
                        <div>W</div>
                        <div>T</div>
                        <div>F</div>
                        <div>S</div>
                    </div>
                    <div class="calendar-days" id="calendarDays"></div>
                </div>
            </div>
        </div>

        <!-- Bottom: Browser -->
        <div class="browser-section">
            <div class="browser-header">
                <input type="text" id="urlInput" placeholder="Search or enter URL..." class="url-input">
                <button id="goButton" class="go-button">Go</button>
            </div>
            <div class="browser-content">
                <iframe id="browserFrame" src="about:blank" title="Website Browser"></iframe>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
