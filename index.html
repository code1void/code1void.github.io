<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>codev1od</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background video (movable wallpaper: using repo default) -->
    <video id="bg-video" autoplay muted loop playsinline style="position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;" aria-hidden="true">
        <source src="Videos/default.mp4" type="video/mp4">
    </video>

    <!-- Splash Screen -->
    <div class="splash-screen" id="splashScreen">
        <div class="splash-content">
            <div class="splash-logo">CODEV1OD</div>
            <div class="splash-subtitle">Dashboard</div>
            <div class="splash-hint">Click anywhere to continue</div>
            <div class="splash-loader">
                <div class="loader-dot"></div>
                <div class="loader-dot"></div>
                <div class="loader-dot"></div>
            </div>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div class="dashboard" id="dashboard">
        <!-- Animated Background -->
        <div class="background" id="background"></div>
        <div class="rain" id="rain"></div>
        
        <!-- Main Content -->
        <div class="main-content">
            <!-- Time Display (Centered) -->
            <div class="time-display" id="timeDisplay">00:00</div>
            <div class="date-display" id="dateDisplay">Monday, January 1</div>
        </div>

        <!-- Side Calendar -->
        <div class="side-calendar">
            <div class="calendar-widget">
                <div class="calendar-header">
                    <button id="prevMonth" class="month-btn">‹</button>
                    <h3 id="monthYear"></h3>
                    <button id="nextMonth" class="month-btn">›</button>
                </div>
                <div class="calendar-weekdays">
                    <div>S</div>
                    <div>M</div>
                    <div>T</div>
                    <div>W</div>
                    <div>T</div>
                    <div>F</div>
                    <div>S</div>
                </div>
                <div class="calendar-days" id="calendarDays"></div>
            </div>
        </div>

        <!-- Bottom Tab Bar -->
        <div class="tab-bar">
            <!-- Background Tabs -->
            <div class="tabs-container">
                <div class="tab" data-bg="spring" title="Spring">
                    <span class="tab-icon">◌</span>
                </div>
                <div class="tab" data-bg="summer" title="Summer">
                    <span class="tab-icon">◉</span>
                </div>
                <div class="tab" data-bg="fall" title="Fall">
                    <span class="tab-icon">◆</span>
                </div>
                <div class="tab" data-bg="winter" title="Winter">
                    <span class="tab-icon">❄</span>
                </div>
                <div class="tab" data-bg="hacker-green" title="Hacker Green">
                    <span class="tab-icon">&gt;</span>
                </div>
                <div class="tab" data-bg="hacker-purple" title="Hacker Purple">
                    <span class="tab-icon">◆</span>
                </div>
            </div>

            <!-- Browser Tab -->
            <div class="browser-tab">
                <span class="browser-tab-title">Browser</span>
                <button id="toggleBrowser" class="browser-toggle">^</button>
                <!-- Quick Launch to dulo.gd -->
                <button id="duloBtn" class="browser-toggle" title="Open dulo.gd">dulo.gd</button>
            </div>
        </div>

        <!-- Browser Section -->
        <div class="browser-section" id="browserSection">
            <div class="browser-header">
                <input type="text" id="urlInput" placeholder="Search or enter URL..." class="url-input">
                <button id="goButton" class="go-button">Go</button>
            </div>
            <div class="browser-content">
                <iframe id="browserFrame" src="about:blank" title="Website Browser"></iframe>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
